name = "dungeon-achievements"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "da_generate_events"

[[kv_namespaces]]
binding = "REVIEW_CAPTURE"
id = "56d19a083fd7486997fc9c436a834d5a"

[vars]
REVIEW_CAPTURE_ENABLED = "true"

# Runtime fallback: if OpenRouter fails, /generate retries on Workers AI before
# giving up and serving canned achievements. Free tier covers this site's volume.
[ai]
binding = "AI"

# Secrets (set via `wrangler pages secret put OPENROUTER_API_KEY`):
# OPENROUTER_API_KEY      -- required
# OPENROUTER_MODEL        -- optional, defaults to anthropic/claude-haiku-5.5
