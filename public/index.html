<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Achievements Generator</title>
    <!-- Fonts: self-hosted — no external CDN requests -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/PressStart2P-Regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-variable.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-latin-400-italic.woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'Press Start 2P';
            src: url('/fonts/PressStart2P-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Outfit Variable';
            src: url('/fonts/outfit-variable.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Cormorant Garamond';
            src: url('/fonts/cormorant-garamond-latin-400-normal.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Cormorant Garamond';
            src: url('/fonts/cormorant-garamond-latin-400-italic.woff2') format('woff2');
            font-weight: 400;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: 'Cormorant Garamond';
            src: url('/fonts/cormorant-garamond-latin-600-normal.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        /* ── Crawler Codex tokens ────────────────────────────────── */
        :root {
            --c-bg:           #0b0906;
            --c-bg-raised:    #100c08;
            --c-panel:        rgba(20, 14, 9, 0.82);
            --c-ink:          #f0e8dc;
            --c-muted:        #b89e8a;
            --c-muted-soft:   rgba(240, 232, 220, 0.60);
            --c-line:         rgba(240, 232, 220, 0.10);
            --c-line-strong:  rgba(240, 232, 220, 0.16);
            --c-accent:       #ae724c;       /* iron-rust */
            --c-accent-soft:  #c4845a;       /* phosphor-amber — AI voice */
            --c-amber:        #e6a674;       /* warm highlight */
            --c-rivet:        rgba(174, 114, 76, 0.6);  /* rivet dots */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit Variable', 'Avenir Next', 'Segoe UI', sans-serif;
            background: var(--c-bg);
            color: var(--c-ink);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.4rem;
            color: var(--c-accent-soft);
            text-shadow: 3px 3px 0px rgba(0,0,0,0.9), 0 0 24px rgba(196, 132, 90, 0.35);
            margin-bottom: 16px;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.15rem;
            font-style: italic;
            color: var(--c-muted);
            line-height: 1.65;
            margin-bottom: 20px;
            text-wrap: balance;
        }

        .input-section {
            background: var(--c-panel);
            border: 1px solid var(--c-line-strong);
            border-radius: 10px;
            padding: 28px;
            margin-bottom: 28px;
            /* rivet corners */
            background-image:
                radial-gradient(circle at 10px 10px, var(--c-rivet) 2.5px, transparent 3px),
                radial-gradient(circle at calc(100% - 10px) 10px, var(--c-rivet) 2.5px, transparent 3px),
                radial-gradient(circle at 10px calc(100% - 10px), var(--c-rivet) 2.5px, transparent 3px),
                radial-gradient(circle at calc(100% - 10px) calc(100% - 10px), var(--c-rivet) 2.5px, transparent 3px);
        }

        .input-label {
            display: block;
            font-size: 0.8rem;
            color: var(--c-accent-soft);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-family: 'Outfit Variable', sans-serif;
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--c-line-strong);
            border-radius: 6px;
            color: var(--c-ink);
            resize: vertical;
            min-height: 60px;
        }

        .input-field::placeholder {
            color: rgba(240, 232, 220, 0.42);
            opacity: 1;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--c-accent);
            box-shadow: 0 0 0 3px rgba(174, 114, 76, 0.25);
        }

        .style-selector {
            margin-top: 20px;
        }

        .style-label {
            font-size: 0.75rem;
            color: var(--c-muted);
            margin-bottom: 10px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .style-pills {
            display: grid;
            grid-template-columns: repeat(4, auto);
            justify-content: start;
            gap: 8px;
        }

        .style-pill {
            padding: 5px 10px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--c-line-strong);
            border-radius: 999px;
            color: var(--c-muted);
            font-family: 'Outfit Variable', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .style-pill:hover {
            border-color: var(--c-accent);
            color: var(--c-accent-soft);
        }

        .style-pill.active {
            border-color: var(--c-accent);
            color: var(--c-amber);
            background: rgba(174, 114, 76, 0.15);
            box-shadow: 0 0 8px rgba(174, 114, 76, 0.2);
        }

        .examples-section {
            margin-top: 24px;
            margin-bottom: 0;
        }

        .examples-section.hidden {
            display: none;
        }

        .examples-title {
            color: var(--c-accent-soft);
            font-size: 0.9rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        .example-btn {
            padding: 10px 14px;
            background: rgba(174, 114, 76, 0.06);
            border: 1px solid var(--c-line-strong);
            border-radius: 7px;
            color: var(--c-muted);
            font-family: 'Outfit Variable', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .example-btn:hover {
            border-color: var(--c-accent);
            background: rgba(174, 114, 76, 0.12);
            color: var(--c-ink);
        }

        .generate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ae724c 0%, #c07e54 100%);
            border: none;
            border-radius: 7px;
            color: #f0e8dc;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Outfit Variable', sans-serif;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 20px;
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(174, 114, 76, 0.45);
        }

        .generate-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .achievements-section {
            margin-top: 28px;
        }

        .achievements-title {
            color: var(--c-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
            text-align: center;
        }

        @keyframes achievementReveal {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .achievement {
            background: var(--c-panel);
            border: 1px solid var(--c-line-strong);
            border-radius: 10px;
            padding: 18px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            opacity: 0;
            animation: achievementReveal 0.4s ease forwards;
            /* rivet corners */
            background-image:
                radial-gradient(circle at 8px 8px, var(--c-rivet) 2px, transparent 3px),
                radial-gradient(circle at calc(100% - 8px) 8px, var(--c-rivet) 2px, transparent 3px),
                radial-gradient(circle at 8px calc(100% - 8px), var(--c-rivet) 2px, transparent 3px),
                radial-gradient(circle at calc(100% - 8px) calc(100% - 8px), var(--c-rivet) 2px, transparent 3px);
        }

        .achievement:nth-child(1) { animation-delay: 0.05s; }
        .achievement:nth-child(2) { animation-delay: 0.2s; }
        .achievement:nth-child(3) { animation-delay: 0.35s; }

        .achievement:hover {
            border-color: var(--c-accent);
            box-shadow: 0 4px 20px rgba(174, 114, 76, 0.18);
        }

        .achievement-text {
            font-size: 0.97rem;
            line-height: 1.65;
            flex: 1;
            cursor: pointer;
            word-wrap: break-word;
        }

        .achievement-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 96px;
            flex-shrink: 0;
        }

        .copy-btn {
            padding: 6px 10px;
            background: rgba(174, 114, 76, 0.10);
            border: 1px solid var(--c-line-strong);
            border-radius: 5px;
            color: var(--c-accent-soft);
            font-size: 0.78rem;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
            white-space: nowrap;
            font-family: 'Outfit Variable', sans-serif;
            width: 100%;
            text-align: center;
            display: block;
        }

        .copy-btn:hover {
            background: rgba(174, 114, 76, 0.22);
            border-color: var(--c-accent);
        }

        .loading {
            text-align: center;
            color: var(--c-accent-soft);
            font-size: 1rem;
            line-height: 2;
            position: relative;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loading-fx {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* Loading console — 3-frame sequence */
        .loading-console {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 520px;
            text-align: left;
            padding: 0 12px;
        }

        .loading-echo {
            font-family: 'SFMono-Regular', 'SF Mono', Consolas, monospace;
            font-size: 0.82rem;
            color: var(--c-muted);
            min-height: 1.4em;
            letter-spacing: 0.03em;
        }

        .loading-dossier {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1rem;
            font-style: italic;
            color: var(--c-amber);
            margin-top: 10px;
            min-height: 1.4em;
            opacity: 0;
            transition: opacity 0.5s ease;
            text-shadow: 0 0 8px rgba(230, 166, 116, 0.3);
        }

        .loading-verdict {
            font-size: 0.84rem;
            color: var(--c-muted);
            margin-top: 12px;
            min-height: 1.4em;
            opacity: 0;
            transition: opacity 0.4s ease;
            animation: oraclePulse 2s ease-in-out infinite;
        }

        @keyframes oraclePulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 6px rgba(196, 132, 90, 0.35); }
            50% { opacity: 0.55; text-shadow: 0 0 16px rgba(196, 132, 90, 0.7); }
        }

        /* Skeleton cards — shown while loading */
        .skeleton-cards {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .skeleton-card {
            background: rgba(16, 12, 8, 0.6);
            border: 1px solid var(--c-line);
            border-radius: 10px;
            padding: 18px 20px;
        }

        .skeleton-line {
            border-radius: 4px;
            background: rgba(240, 232, 220, 0.06);
        }

        @media (prefers-reduced-motion: no-preference) {
            .skeleton-line {
                background: linear-gradient(90deg,
                    rgba(240,232,220,0.05) 25%,
                    rgba(196,132,90,0.12) 50%,
                    rgba(240,232,220,0.05) 75%);
                background-size: 200% 100%;
                animation: skeletonShimmer 1.8s ease-in-out infinite;
            }
        }

        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .sk-title  { height: 13px; width: 55%; margin-bottom: 12px; }
        .sk-body   { height: 9px;  width: 90%; margin-bottom: 6px; }
        .sk-body2  { height: 9px;  width: 75%; margin-bottom: 12px; }
        .sk-reward { height: 8px;  width: 60%; opacity: 0.5; }

        @keyframes fxFadeInOut {
            0%   { opacity: 0; transform: scale(0.4) rotate(0deg); }
            35%  { opacity: 1; transform: scale(1) rotate(120deg); }
            100% { opacity: 0; transform: scale(0.2) rotate(360deg); }
        }

        @keyframes fxRuneFloat {
            0%   { opacity: 0; transform: translateY(0) rotate(-10deg); }
            20%  { opacity: 0.9; }
            80%  { opacity: 0.7; }
            100% { opacity: 0; transform: translateY(-28px) rotate(10deg); }
        }

        .error {
            background: rgba(220,20,60,0.12);
            border: 1px solid rgba(220,20,60,0.5);
            color: #e8a0a0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .recent-section {
            margin-top: 40px;
            border-top: 1px solid var(--c-line);
            padding-top: 28px;
        }

        .recent-title {
            color: var(--c-muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 1rem;
            }
            .input-section {
                padding: 20px;
            }
            .examples-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">🏆 Dungeon Achievements 🏆</h1>
            <p class="subtitle">
                The System is watching. Your deeds — heroic, mundane, or deeply questionable — are being logged. Describe what you did. Receive the achievements you deserve.
            </p>
        </header>

        <div class="input-section">
            <label class="input-label" for="activityInput">What did you do?</label>
            <textarea
                id="activityInput"
                class="input-field"
                placeholder="e.g., Made coffee this morning, Survived a Zoom meeting, Finished a project..."
            ></textarea>

            <div class="style-selector">
                <span class="style-label">Style:</span>
                <div class="style-pills">
                    <button class="style-pill active" data-style="default">🏰 DCC Default</button>
                    <button class="style-pill" data-style="corporate">💼 Corporate</button>
                    <button class="style-pill" data-style="funny">🤪 Absurd</button>
                    <button class="style-pill" data-style="nice">💖 Wholesome</button>
                    <button class="style-pill" data-style="mean">🔥 Brutal</button>
                    <button class="style-pill" data-style="pirate">🏴‍☠️ Pirate</button>
                    <button class="style-pill" data-style="shakespeare">📜 Bard</button>
                </div>
            </div>

            <div class="examples-section hidden">
                <h3 class="examples-title">Quick Examples:</h3>
                <div class="examples-grid">
                    <button class="example-btn" onclick="setExample('Made coffee this morning')">☕ Made coffee this morning</button>
                    <button class="example-btn" onclick="setExample('Survived a Zoom meeting')">💻 Survived a Zoom meeting</button>
                    <button class="example-btn" onclick="setExample('Forgot to save my work')">💾 Forgot to save my work</button>
                    <button class="example-btn" onclick="setExample('Successfully parallel parked')">🚗 Successfully parallel parked</button>
                </div>
            </div>

            <button id="generateBtn" class="generate-btn" onclick="generateAchievements()">
                ⚔️ Generate Achievements
            </button>
        </div>

        <div id="achievementsSection" class="achievements-section" style="display: none;">
            <h2 class="achievements-title">Your Achievements:</h2>
            <div id="achievementsList"></div>
        </div>

        <div id="recentSection" class="recent-section" style="display: none;">
            <h3 class="recent-title">Recent Achievements:</h3>
            <div id="recentList"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let selectedStyle = 'default';
        let currentAchievements = [];
        let recentAchievements = [];

        // Style pill selection
        document.querySelectorAll('.style-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.style-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedStyle = btn.dataset.style;
            });
        });

        function setExample(text) {
            document.getElementById('activityInput').value = text;
            document.getElementById('activityInput').focus();
        }

        const loadingMessages = [
            '🔮 The Oracle stirs. It is reviewing your permanent record.',
            '📜 Cross-referencing your deed against the Hall of Mediocrity...',
            '👁️ The System sees you. It is not impressed. Yet.',
            '⚙️ Converting your questionable choices into digital glory...',
            '🎲 Rolling for cosmic judgment. The dice are judging you.',
            '🧮 Calculating the exact magnitude of your achievement...',
            '🌀 Translating mundane existence into epic terminology...',
            '⚡ The AI is being brutally honest. This may take a moment.',
            '🔭 Locating your deed in the Grand Ledger of Human Effort...',
            '🏺 The Oracle has seen worse. Probably.',
            '💀 Consulting the ancient achievement scrolls...',
            '🎯 Precision-targeting your ego. Stand by.',
            '🗂️ Accessing your file. Oh. Oh no. Accessing anyway.',
            '📊 Question: Has anyone done this before? Answer: Yes. It did not end well.',
            '⏳ The System is briefly distracted by something more interesting in Sector 7.',
            '🌑 Initiating the Judgment Subroutines. This takes careful consideration.',
            '☠️ Cross-referencing this against your 847 previous disappointments...',
            '👁️ The All-Seeing Eye is buffering. Please hold.',
            '🎪 Locating the least flattering interpretation of what you just did...',
            '💫 The Oracle is reviewing your permanent record. It has opinions.',
            '🩻 Performing a full spiritual X-ray. Results: concerning.',
            '🔬 Analyzing the precise cocktail of hubris and optimism required to attempt this.',
            '📡 Signal received. Evaluating whether you deserve acknowledgment. Jury is out.',
            '⚗️ Distilling your mediocrity into something approaching achievement...',
            '🌀 The dungeon AI has seen empires fall. It will judge your thing too.',
            '🕯️ Consulting with previous crawlers who also did this. They said: yikes.',
            '🧿 Peering into the temporal stream to see how this usually turns out. Loading...',
        ];

        // ===== LOADING EFFECTS =====
        let activeEffect = null;

        function stopEffect() {
            if (activeEffect) { activeEffect(); activeEffect = null; }
        }

        // Effect: Gold sparkle stars
        function fxSparkles(el) {
            const symbols = ['✦','✧','⊹','✺','✹','⋆','˚','·','✼','❋'];
            const created = [];
            const iv = setInterval(() => {
                for (let i = 0; i < Math.floor(Math.random() * 3) + 1; i++) {
                    const s = document.createElement('span');
                    s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                    const size = Math.random() * 20 + 7;
                    const dur = (Math.random() * 1.4 + 0.9).toFixed(2);
                    const hue = Math.random() * 55 + 25;
                    s.style.cssText = `position:absolute;left:${(Math.random()*86+4).toFixed(1)}%;` +
                        `top:${(Math.random()*72+8).toFixed(1)}%;font-size:${size}px;` +
                        `color:hsl(${hue},100%,${(Math.random()*25+60).toFixed()}%);` +
                        `text-shadow:0 0 ${(size/2).toFixed()}px hsl(${hue},100%,80%);` +
                        `pointer-events:none;animation:fxFadeInOut ${dur}s ease-in-out forwards;`;
                    el.appendChild(s);
                    created.push(s);
                    setTimeout(() => s.remove(), parseFloat(dur) * 1000 + 100);
                }
            }, 160);
            return () => { clearInterval(iv); created.forEach(e => e.remove()); };
        }

        // Effect: Spectral canvas tendrils
        function fxTendrils(el) {
            const cv = document.createElement('canvas');
            cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
            el.appendChild(cv);
            let W = cv.width = el.offsetWidth, H = cv.height = el.offsetHeight;
            const ctx = cv.getContext('2d');
            const lines = [];
            const addLine = () => {
                const sy = Math.random() * H;
                lines.push({
                    x0: -10, y0: sy,
                    cx1: W*.25 + Math.random()*W*.2, cy1: sy + (Math.random()-.5)*H*.7,
                    cx2: W*.55 + Math.random()*W*.2, cy2: sy + (Math.random()-.5)*H*.7,
                    x1: W+10, y1: Math.random()*H,
                    t: 0, spd: 0.003 + Math.random()*0.004,
                    hue: Math.random() > .5 ? 195+Math.random()*40 : 275+Math.random()*40,
                });
            };
            addLine();
            const spawnIv = setInterval(addLine, 700);
            let raf;
            const draw = () => {
                ctx.clearRect(0, 0, W, H);
                for (let i = lines.length-1; i >= 0; i--) {
                    const l = lines[i];
                    l.t = Math.min(l.t + l.spd, 1);
                    const alpha = l.t < .5 ? l.t*2 : (1-l.t)*2;
                    ctx.beginPath();
                    for (let s = 0; s <= 40*l.t; s++) {
                        const p = s/40;
                        const bx = (1-p)**3*l.x0 + 3*(1-p)**2*p*l.cx1 + 3*(1-p)*p*p*l.cx2 + p**3*l.x1;
                        const by = (1-p)**3*l.y0 + 3*(1-p)**2*p*l.cy1 + 3*(1-p)*p*p*l.cy2 + p**3*l.y1;
                        s === 0 ? ctx.moveTo(bx, by) : ctx.lineTo(bx, by);
                    }
                    ctx.strokeStyle = `hsla(${l.hue},100%,75%,${alpha*.7})`;
                    ctx.lineWidth = 1.5; ctx.shadowColor = `hsl(${l.hue},100%,75%)`; ctx.shadowBlur = 8;
                    ctx.stroke(); ctx.shadowBlur = 0;
                    if (l.t >= 1) lines.splice(i, 1);
                }
                raf = requestAnimationFrame(draw);
            };
            draw();
            return () => { cancelAnimationFrame(raf); clearInterval(spawnIv); cv.remove(); };
        }

        // Effect: Smoke wisps
        function fxSmoke(el) {
            const cv = document.createElement('canvas');
            cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
            el.appendChild(cv);
            let W = cv.width = el.offsetWidth, H = cv.height = el.offsetHeight;
            const ctx = cv.getContext('2d');
            const pts = [];
            const spawnIv = setInterval(() => {
                for (let i=0;i<2;i++) pts.push({
                    x: W*.15 + Math.random()*W*.7, y: H+10,
                    vx: (Math.random()-.5)*.9, vy: -(Math.random()*1.1+.4),
                    r: Math.random()*16+8, a: Math.random()*.22+.08,
                    hue: Math.random() > .5 ? 195 : 260,
                });
            }, 220);
            let raf;
            const draw = () => {
                ctx.clearRect(0, 0, W, H);
                for (let i = pts.length-1; i >= 0; i--) {
                    const p = pts[i];
                    p.x += p.vx; p.y += p.vy; p.r += .25; p.a -= .0025;
                    if (p.a <= 0 || p.y < -p.r) { pts.splice(i,1); continue; }
                    const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
                    g.addColorStop(0, `hsla(${p.hue},55%,80%,${p.a})`);
                    g.addColorStop(1, `hsla(${p.hue},55%,80%,0)`);
                    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                    ctx.fillStyle = g; ctx.fill();
                }
                raf = requestAnimationFrame(draw);
            };
            draw();
            return () => { cancelAnimationFrame(raf); clearInterval(spawnIv); cv.remove(); };
        }

        // Effect: Floating runes
        function fxRunes(el) {
            const runes = ['ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᚷ','ᚹ','ᚾ','ᛁ','ᛇ','ᛈ','ᛉ','ᛋ','ᛏ','ᛒ','ᛖ','ᛗ','ᛚ','ᛟ','☽','⊛','◈','⧫','⁂','꩜'];
            const created = [];
            const iv = setInterval(() => {
                const s = document.createElement('span');
                s.textContent = runes[Math.floor(Math.random()*runes.length)];
                const size = Math.random()*16+10;

        // Effect: Lightning arcs
        function fxLightning(el) {
            const cv = document.createElement('canvas');
            cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
            el.appendChild(cv);
            let W = cv.width = el.offsetWidth, H = cv.height = el.offsetHeight;
            const ctx = cv.getContext('2d');

            function bolt(x1, y1, x2, y2, spread, depth) {
                if (depth <= 0) { ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); return; }
                const mx = (x1+x2)/2 + (Math.random()-.5)*spread;
                const my = (y1+y2)/2 + (Math.random()-.5)*spread;
                bolt(x1,y1,mx,my,spread/2,depth-1);
                bolt(mx,my,x2,y2,spread/2,depth-1);
                if (Math.random() < 0.3) bolt(mx,my,mx+(Math.random()-.5)*spread*2,my+(Math.random()-.5)*spread*2,spread/2,depth-2);
            }

            let raf;
            function flash() {
                ctx.clearRect(0,0,W,H);
                const n = Math.floor(Math.random()*2)+1;
                for (let i=0;i<n;i++) {
                    const x1=Math.random()*W, y1=0, x2=x1+(Math.random()-.5)*W*.6, y2=H;
                    const hue = Math.random()>.5 ? 200 : 55;
                    ctx.beginPath();
                    bolt(x1,y1,x2,y2,60,5);
                    ctx.strokeStyle = `hsla(${hue},100%,85%,0.9)`;
                    ctx.lineWidth = 1; ctx.shadowColor = `hsl(${hue},100%,75%)`; ctx.shadowBlur = 12;
                    ctx.stroke(); ctx.shadowBlur = 0;
                }
                // Fade out
                let alpha = 1;
                const fade = () => {
                    alpha -= 0.08;
                    if (alpha <= 0) { ctx.clearRect(0,0,W,H); setTimeout(flash, Math.random()*1200+400); return; }
                    ctx.globalAlpha = alpha;
                    raf = requestAnimationFrame(fade);
                };
                ctx.globalAlpha = 1;
                setTimeout(fade, 80);
            }
            flash();
            return () => { cancelAnimationFrame(raf); cv.remove(); };
        }

        // Effect: Ember rain
        function fxEmbers(el) {
            const cv = document.createElement('canvas');
            cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
            el.appendChild(cv);
            let W = cv.width = el.offsetWidth, H = cv.height = el.offsetHeight;
            const ctx = cv.getContext('2d');
            const pts = [];
            const spawnIv = setInterval(() => {
                for (let i=0;i<3;i++) pts.push({
                    x: Math.random()*W, y: -8,

                    r: Math.random()*3+1.5,
                    hue: Math.random()*40+15, // orange-gold
                    a: Math.random()*.7+.3,
                });
            }, 120);
            let raf;
            const draw = () => {
                ctx.clearRect(0,0,W,H);
                for (let i=pts.length-1;i>=0;i--) {
                    const p=pts[i];
                    p.x+=p.vx; p.y+=p.vy; p.vx+=(Math.random()-.5)*.15;
                    p.a-=0.007;
                    if (p.a<=0||p.y>H+8) { pts.splice(i,1); continue; }
                    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                    ctx.fillStyle=`hsla(${p.hue},100%,70%,${p.a})`;
                    ctx.shadowColor=`hsl(${p.hue},100%,70%)`; ctx.shadowBlur=6;
                    ctx.fill(); ctx.shadowBlur=0;

                raf=requestAnimationFrame(draw);

        // Effect: Constellation
        function fxConstellation(el) {
            const cv = document.createElement('canvas');
            cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
            el.appendChild(cv);
            let W = cv.width = el.offsetWidth, H = cv.height = el.offsetHeight;
            const ctx = cv.getContext('2d');
            const stars = Array.from({length:14}, () => ({
                x: Math.random()*W, y: Math.random()*H,
                vx: (Math.random()-.5)*.18, vy: (Math.random()-.5)*.18,
                r: Math.random()*2.5+1,
                phase: Math.random()*Math.PI*2,
            }));
            let t=0, raf;
            const draw = () => {
                ctx.clearRect(0,0,W,H);
                t+=0.025;
                // Draw connecting lines for nearby pairs
                for (let i=0;i<stars.length;i++) {
                    for (let j=i+1;j<stars.length;j++) {
                        const dx=stars[i].x-stars[j].x, dy=stars[i].y-stars[j].y;
                        const dist=Math.sqrt(dx*dx+dy*dy);
                        if (dist<W*.28) {
                            const a=(1-dist/(W*.28))*.35;
                            ctx.beginPath(); ctx.moveTo(stars[i].x,stars[i].y); ctx.lineTo(stars[j].x,stars[j].y);
                            ctx.strokeStyle=`rgba(180,160,255,${a})`; ctx.lineWidth=.8; ctx.stroke();
                        }
                    }
                }
                // Draw stars
                stars.forEach(s => {
                    s.x+=s.vx; s.y+=s.vy;
                    if (s.x<0||s.x>W) s.vx*=-1;
                    if (s.y<0||s.y>H) s.vy*=-1;
                    const pulse = .5+.5*Math.sin(t*2+s.phase);
                    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*(0.7+0.3*pulse),0,Math.PI*2);
                    ctx.fillStyle=`rgba(220,200,255,${0.6+0.4*pulse})`;
                    ctx.shadowColor='rgba(180,160,255,1)'; ctx.shadowBlur=8*pulse;
                    ctx.fill(); ctx.shadowBlur=0;
                });
                raf=requestAnimationFrame(draw);
            };
            draw();
            return () => { cancelAnimationFrame(raf); cv.remove(); };
        }

        // Effect: Expanding ripples
        function fxRipples(el) {
            const cv = document.createElement('canvas');
            cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
            el.appendChild(cv);
            let W = cv.width = el.offsetWidth, H = cv.height = el.offsetHeight;
            const ctx = cv.getContext('2d');
            const rings = [];
            const spawnIv = setInterval(() => {
                rings.push({
                    x: W*.1+Math.random()*W*.8, y: H*.1+Math.random()*H*.8,
                    r: 0, maxR: Math.random()*80+40,
                    hue: Math.random()>0.5 ? 45 : 185,
                    a: 0.7,
                });
            }, 500);
            let raf;
            const draw = () => {
                ctx.clearRect(0,0,W,H);
                for (let i=rings.length-1;i>=0;i--) {
                    const rg=rings[i];
                    rg.r+=2.2; rg.a-=0.014;
                    if (rg.a<=0) { rings.splice(i,1); continue; }
                    ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.r,0,Math.PI*2);
                    ctx.strokeStyle=`hsla(${rg.hue},100%,70%,${rg.a})`;
                    ctx.lineWidth=1.5; ctx.shadowColor=`hsl(${rg.hue},100%,70%)`; ctx.shadowBlur=8;
                    ctx.stroke(); ctx.shadowBlur=0;
                }
                raf=requestAnimationFrame(draw);
            };
            draw();
            return () => { cancelAnimationFrame(raf); clearInterval(spawnIv); cv.remove(); };
        }

        // Effect: Ghost orbs
        function fxOrbs(el) {
            const cv = document.createElement('canvas');
            cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
            el.appendChild(cv);
            let W = cv.width = el.offsetWidth, H = cv.height = el.offsetHeight;
            const ctx = cv.getContext('2d');
            const orbs = Array.from({length:5}, () => ({
                x: Math.random()*W, y: Math.random()*H,
                r: Math.random()*28+18,
                hue: [195,270,300,45,160][Math.floor(Math.random()*5)],
                ox: Math.random()*W, oy: Math.random()*H,
                ax: (Math.random()-.5)*W*.6, ay: (Math.random()-.5)*H*.6,
                spd: Math.random()*.6+.4, phase: Math.random()*Math.PI*2,
            }));
            let t=0, raf;
            const draw = () => {
                ctx.clearRect(0,0,W,H);
                t+=0.012;
                orbs.forEach(o => {
                    o.x = o.ox + o.ax*Math.sin(t*o.spd+o.phase);
                    o.y = o.oy + o.ay*Math.cos(t*o.spd*0.7+o.phase);
                    const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
                    const pulse=0.12+0.08*Math.sin(t*2+o.phase);
                    g.addColorStop(0,`hsla(${o.hue},80%,85%,${pulse*2.5})`);
                    g.addColorStop(0.4,`hsla(${o.hue},80%,70%,${pulse})`);
                    g.addColorStop(1,`hsla(${o.hue},80%,70%,0)`);
                    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
                    ctx.fillStyle=g; ctx.fill();
                });
                raf=requestAnimationFrame(draw);
            };
            draw();
            return () => { cancelAnimationFrame(raf); cv.remove(); };
        }

        const FX = [fxSparkles, fxTendrils, fxSmoke, fxRunes, fxLightning, fxEmbers, fxConstellation, fxRipples, fxOrbs];

        async function typewriter(el, text, cps = 90) {

        function getCopyContent(index, scope) {

            const text = `*New achievement! ${ach.title}*\n${ach.description}\n${ach.reward}`;
            const html = `<p><em>New achievement! ${escapeHtml(ach.title)}</em></p>`
                + `<p>${escapeHtml(ach.description)}</p>`

        async function copyToClipboard(btn, text, htmlContent) {
            const orig = btn.textContent;
            const done = () => {
                btn.textContent = '✅ Done!';
                setTimeout(() => { btn.textContent = orig; }, 2000);
            };

            // Preferred: clipboard.write with both HTML and plain text independently.
            // HTML pastes rich in Word/Docs/email; plain text carries markdown for Discord/Slack.
            if (window.ClipboardItem && navigator.clipboard?.write) {
                try {
                    await navigator.clipboard.write([new ClipboardItem({
                        'text/html': new Blob([htmlContent], { type: 'text/html' }),
                        'text/plain': new Blob([text], { type: 'text/plain' }),
                    })]);
                    done();
                    return;
                } catch {}
            }

            // Fallback: contenteditable + execCommand (Safari)
            const div = document.createElement('div');
            div.contentEditable = 'true';
            div.innerHTML = htmlContent || text.replace(/\n/g, '<br>');
            div.style.cssText = 'position:fixed;opacity:0;top:0;left:0;pointer-events:none;';
            document.body.appendChild(div);
            const sel = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(div);
            sel.removeAllRanges();
            sel.addRange(range);
            let ok = false;
            try { ok = document.execCommand('copy'); } catch {}
            document.body.removeChild(div);
            sel.removeAllRanges();

            if (ok) { done(); return; }

            navigator.clipboard?.writeText(text).then(done).catch(() => {
                alert('Copy not supported in this browser');
            });
        }

        document.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');

                const row = e.target.closest('.achievement[data-scope]');
                if (!row) return;
                const copyBtn = row.querySelector('[data-action="copy"]');
                if (!copyBtn) return;
                const content = getCopyContent(+row.dataset.index, row.dataset.scope);
                if (content) copyToClipboard(copyBtn, content.text, content.html);
                return;
            }
            e.stopPropagation();
            const { action, index, scope } = btn.dataset;
            if (action === 'copy') {
                const content = getCopyContent(+index, scope);
                if (content) copyToClipboard(btn, content.text, content.html);
            } else if (action === 'image') {
                copyAsImage(+index, scope);
            } else if (action === 'download') {
                downloadImage(btn, +index);
            }
        });

            const FONT_SMALL = "13px Consolas, Monaco, 'Lucida Console', monospace";

            const descLines = wrapText(ctx, description, inner);
            ctx.font = FONT_SMALL;
            const rewardLines = wrapText(ctx, reward, inner);

            const contentH = titleLines.length * LINE + 14
                           + descLines.length * LINE + 18
                           + rewardLines.length * LINE;
            const totalH = pad + contentH + pad + 28; // 28 for watermark

            canvas.width = W * scale;
            canvas.height = totalH * scale;
            ctx.scale(scale, scale);

            // Background
            ctx.fillStyle = '#0b0906';
            ctx.fillRect(0, 0, W, totalH);

            // Card
            const cardX = pad - 10, cardY = pad - 10;
            const cardW = inner + 20, cardH = contentH + 20;
            ctx.beginPath();
            roundRect(ctx, cardX, cardY, cardW, cardH, 10);
            ctx.fillStyle = 'rgba(20,14,9,0.9)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(240,232,220,0.14)';
            ctx.lineWidth = 1;
            ctx.stroke();
            // Iron-rust left accent bar
            ctx.beginPath();
            roundRect(ctx, cardX, cardY, 3, cardH, [10, 0, 0, 10]);
            ctx.fillStyle = '#ae724c';
            ctx.fill();
            // Rivets at card corners
            const rivetColor = 'rgba(174,114,76,0.55)';
            [[cardX+7, cardY+7],[cardX+cardW-7, cardY+7],[cardX+7, cardY+cardH-7],[cardX+cardW-7, cardY+cardH-7]].forEach(([rx,ry]) => {
                ctx.beginPath(); ctx.arc(rx, ry, 2, 0, Math.PI*2);
                ctx.fillStyle = rivetColor; ctx.fill();
            });

            let y = pad + LINE * 0.8;

            // Title (Cormorant Garamond italic + amber glow)
            ctx.font = FONT_TITLE;
            ctx.fillStyle = '#e6a674';
            ctx.shadowColor = 'rgba(230,166,116,0.4)';
            ctx.shadowBlur = 8;
            for (const line of titleLines) { ctx.fillText(line, pad, y); y += LINE; }
            ctx.shadowBlur = 0;
            y += 10;

            // Description
            ctx.font = FONT;
            ctx.fillStyle = '#f0e8dc';
            for (const line of descLines) { ctx.fillText(line, pad, y); y += LINE; }
            y += 12;

            // Divider
            ctx.beginPath();
            ctx.moveTo(pad, y); ctx.lineTo(pad + inner, y);
            ctx.strokeStyle = 'rgba(240,232,220,0.12)';
            ctx.lineWidth = 1;
            ctx.stroke();
            y += 14;

            // Reward
            ctx.font = `italic ${FONT_SMALL}`;
            ctx.fillStyle = '#b89e8a';
            for (const line of rewardLines) { ctx.fillText(line, pad, y); y += LINE; }

            // Watermark
            ctx.font = '11px Consolas, Monaco, monospace';
            ctx.fillStyle = 'rgba(184,158,138,0.45)';
            ctx.textAlign = 'center';
            ctx.fillText('⚔ achievements.carlkibler.com', W / 2, totalH - 10);

            return canvas;
        }

        function wrapText(ctx, text, maxWidth) {
            if (!text) return [''];
            const words = text.split(' ');
            const lines = [];
            let line = '';
            for (const word of words) {
                const test = line ? line + ' ' + word : word;
                if (ctx.measureText(test).width > maxWidth && line) {
                    lines.push(line);
                    line = word;
                } else {
                    line = test;
                }
            }
            if (line) lines.push(line);
            return lines;
        }

        function roundRect(ctx, x, y, w, h, r) {
            if (typeof r === 'number') r = [r, r, r, r];
            ctx.moveTo(x + r[0], y);
            ctx.lineTo(x + w - r[1], y);
            ctx.arcTo(x + w, y, x + w, y + r[1], r[1]);
            ctx.lineTo(x + w, y + h - r[2]);
            ctx.arcTo(x + w, y + h, x + w - r[2], y + h, r[2]);
            ctx.lineTo(x + r[3], y + h);
            ctx.arcTo(x, y + h, x, y + h - r[3], r[3]);
            ctx.lineTo(x, y + r[0]);
            ctx.arcTo(x, y, x + r[0], y, r[0]);
            ctx.closePath();
        }

        function downloadImage(btn, index) {
            const orig = btn.textContent;
            const scope = btn.dataset.scope;
            const ach = scope === 'recent' ? recentAchievements[index] : currentAchievements[index];
            if (!ach) return;
            const canvas = drawAchievementCanvas(ach);
            const link = document.createElement('a');
            link.download = `achievement-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
            btn.textContent = '✅ Saved!';
            setTimeout(() => { btn.textContent = orig; }, 2000);
        }

        async function copyAsImage(index, scope) {
            const btn = document.querySelector(`[data-action="image"][data-index="${index}"][data-scope="${scope || 'main'}"]`);
            const originalText = btn?.textContent ?? '';

            try {
                if (btn) { btn.textContent = '📸 ...'; btn.disabled = true; }

                const ach = (scope === 'recent' ? recentAchievements : currentAchievements)[index];
                const canvas = drawAchievementCanvas(ach);

                canvas.toBlob(async (blob) => {
                    try {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                        if (btn) {
                            btn.textContent = '✅ Done!';
                            setTimeout(() => { btn.textContent = originalText; btn.disabled = false; }, 2500);
                        }
                    } catch {
                        const link = document.createElement('a');
                        link.download = `achievement-${Date.now()}.png`;
                        link.href = canvas.toDataURL();
                        link.click();
                        if (btn) {
                            btn.textContent = '📥 Saved!';
                            setTimeout(() => { btn.textContent = originalText; btn.disabled = false; }, 2500);
                        }
                    }
                }, 'image/png');

            } catch (error) {
                console.error('Error creating image:', error);
                if (btn) {
                    btn.textContent = '❌ Error';
                    setTimeout(() => { btn.textContent = originalText; btn.disabled = false; }, 2500);
                }
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function saveToRecent(activity, achievements, style) {
            const recent = JSON.parse(localStorage.getItem('recentAchievements') || '[]');
            recent.unshift({ activity, achievements, style, timestamp: new Date().toISOString() });
            recent.splice(10);
            localStorage.setItem('recentAchievements', JSON.stringify(recent));
        }

        function loadRecent() {
            const recent = JSON.parse(localStorage.getItem('recentAchievements') || '[]');
            const recentSection = document.getElementById('recentSection');
            const recentList = document.getElementById('recentList');

            if (recent.length === 0) { recentSection.style.display = 'none'; return; }

            recentAchievements = recent.flatMap(e => e.achievements);

            recentSection.style.display = 'block';
            let recIdx = 0;
            recentList.innerHTML = recent.slice(0, 5).map((entry) => `
                <div style="margin-bottom:20px;padding:14px;border:1px solid #4a5568;border-radius:8px;background:rgba(0,0,0,0.2);">
                    <div style="color:#a0a6ad;font-size:0.85rem;margin-bottom:10px;">
                        "${escapeHtml(entry.activity)}" — ${new Date(entry.timestamp).toLocaleDateString()}
                        ${entry.style && entry.style !== 'default' ? `<span style="margin-left:6px;color:#ffd70099;">[${entry.style}]</span>` : ''}
                    </div>
                    ${entry.achievements.map((ach) => {
                        const { formattedText } = formatAchievement(ach);
                        const idx = recIdx++;
                        return `
                            <div class="achievement" style="margin-bottom:8px;animation:none;opacity:1;"
                                 data-index="${idx}" data-scope="recent">
                                <div class="achievement-actions">
                                    <button class="copy-btn" id="copy-recent-${idx}"
                                            data-action="copy" data-index="${idx}" data-scope="recent">
                                        📋 Copy
                                    </button>
                                    <button class="copy-btn" data-action="image" data-index="${idx}" data-scope="recent">
                                        🖼️ Image
                                    </button>
                                    <button class="copy-btn" data-action="download" data-index="${idx}" data-scope="recent">
                                        💾 Save
                                    </button>
                                </div>
                                <div class="achievement-text" style="font-size:0.88rem;">${formattedText}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadRecent();
            // Show examples only for first-time visitors
            if (!localStorage.getItem('recentAchievements')) {
                document.querySelector('.examples-section').classList.remove('hidden');
            }
        });

        document.getElementById('activityInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.ctrlKey && !e.shiftKey) {
                e.preventDefault();
                generateAchievements();
            }
        });
    </script>
</body>
</html>
